name: Rebuild library zip (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: luna-frontier-2.0-skyalow
      - name: Rebuild node-library.zip
        run: bash scripts/build-library-zip.sh
      - name: Commit rebuilt zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add production_plugins/node-library.zip
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: rebuild node-library.zip for Luna Library 1.7.2"
            git push
          fi
