name: Tests

# PHPUnit には Luna_Release_Package_Test が含まれる。
# luna.zip は Git 管理しない。Release ワークフローと同じ順で
# フロントをビルドし、build.json を刻んでから検証用 ZIP を作る。
# ZIP が無い検査のスキップはしない。

on:
  push:
    branches:
      - master
      - 'release/**'
      - 'luna-frontier-**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, zip, mbstring, dom, libxml, json
          coverage: none
          tools: composer:v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # wp-phpunit（テストスイート）と WordPress 本体は別物なので、コアを別途取得する。
      # バージョンがずれるとテストスイートがコアの内部変更に追随できないため、
      # composer.lock の wp-phpunit のバージョン系列に合わせる。
      - name: Resolve WordPress core version
        id: wp
        run: |
          series="$(php -r '
            $lock = json_decode(file_get_contents("composer.lock"), true);
            $packages = array_merge($lock["packages"] ?? [], $lock["packages-dev"] ?? []);
            foreach ($packages as $p) {
              if ("wp-phpunit/wp-phpunit" === $p["name"]) {
                $parts = explode(".", ltrim($p["version"], "v"));
                echo $parts[0] . "." . ($parts[1] ?? "0");
                exit;
              }
            }
          ')"
          if [ -z "$series" ]; then
            echo "wp-phpunit のバージョンを composer.lock から解決できませんでした"
            exit 1
          fi
          echo "series=$series" >> "$GITHUB_OUTPUT"
          echo "WordPress core series: $series"

      - name: Download WordPress core
        run: |
          series="${{ steps.wp.outputs.series }}"
          url="https://wordpress.org/wordpress-${series}.tar.gz"

          if ! curl -fsSL -o /tmp/wp.tar.gz "$url"; then
            echo "$url を取得できないため latest へフォールバックします"
            curl -fsSL -o /tmp/wp.tar.gz "https://wordpress.org/latest.tar.gz"
          fi

          mkdir -p /tmp/wp-core
          tar xzf /tmp/wp.tar.gz -C /tmp/wp-core --strip-components=1
          test -f /tmp/wp-core/wp-settings.php
          php -r 'require "/tmp/wp-core/wp-includes/version.php"; echo "WordPress " . $wp_version . PHP_EOL;'

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL が起動しませんでした"
          exit 1

      # release-luna-frontier.yml の「Build dist → Update build.json → Create luna.zip」と同じ。
      # 刻印はジョブ内だけ。コミット済みの build_id は書き換えない。
      - name: Build dist (bun)
        run: |
          bun install --frozen-lockfile || bun install
          bun run build

      - name: Stamp build.json for the verification package
        run: |
          printf '{\n    "build_id": "%s",\n    "built_at": "%s",\n    "version": "%s"\n}\n' \
            "$(date -u +%Y%m%dT%H%M%SZ)-$(git rev-parse --short HEAD)" \
            "$(date -u +%FT%TZ)" \
            "$(grep -m1 '^Version:' style.css | awk '{print $2}')" > build.json

      - name: Create verification luna.zip
        run: bash scripts/build-luna-zip.sh

      - name: Run PHPUnit
        env:
          NODE_TEST_DB_HOST: 127.0.0.1:3306
          NODE_TEST_DB_NAME: wordpress_test
          NODE_TEST_DB_USER: root
          NODE_TEST_DB_PASSWORD: root
          NODE_TEST_WP_CORE_DIR: /tmp/wp-core
        run: vendor/bin/phpunit

      - name: Run PHP regression scripts
        env:
          NODE_TEST_DB_HOST: 127.0.0.1:3306
          NODE_TEST_DB_NAME: wordpress_test
          NODE_TEST_DB_USER: root
          NODE_TEST_DB_PASSWORD: root
          NODE_TEST_WP_CORE_DIR: /tmp/wp-core
        run: |
          set -e
          php scripts/native-app-logic-test.php
          php scripts/verify-luna-material3-roles.php
          for mode in embedded standalone missing; do
            PRODUCT_CARD_TEST_MODE="$mode" php -r '
              require getcwd() . "/vendor/autoload.php";
              putenv("WP_PHPUNIT__TESTS_CONFIG=" . getcwd() . "/tests/wp-tests-config.php");
              require getcwd() . "/vendor/wp-phpunit/wp-phpunit/includes/bootstrap.php";
              require getcwd() . "/scripts/product-card-regression.php";
            '
          done

  # Node 側の静的検証テスト（アイコンサブセット検証器と各種ユニットテスト）。
  # phpunit ジョブとは独立で、依存パッケージも要らない（相対 import と repo のファイルだけ）。
  node-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Run Node unit tests
        run: npm run test:node-unit

      - name: Verify icon subset (static)
        run: bun run verify:icon-subset -- --static-only

  ui-accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium and WebKit
        run: bun x playwright install --with-deps chromium webkit
      - name: Build frontend
        run: bun run build
      - name: Check UI accessibility, archive flow, and table guides
        run: bun run test:ui-a11y
